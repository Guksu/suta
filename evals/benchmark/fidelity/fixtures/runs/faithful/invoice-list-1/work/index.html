<!doctype html>
<!--
  요구 충족률 검사기(scripts/benchmark/fidelity.mjs)를 시험하는 견본 화면 — invoice-list 요청(web-prompts.json)을 지킨 판.
  사람이 손으로 쓴 화면이다. 클래스 이름·구조는 검사기에 맞추지 않았다.
  고객 이름·금액·날짜는 지어 넣었다(실존 회사가 아니게).
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>청구서</title>
<style>
  :root {
    --ink: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --bg: #ffffff;
    --brand: #4338CA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    color: var(--ink); background: var(--bg);
    word-break: keep-all;
  }
  .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
  .sidebar { position: sticky; top: 0; height: 100vh; width: 240px; padding: 20px 12px; border-right: 1px solid var(--line); background: #f9fafb; }
  .brand { margin: 0 12px 24px; font-size: 16px; font-weight: 700; }
  .sidebar ul { list-style: none; margin: 0; padding: 0; }
  .sidebar a { display: flex; align-items: center; height: 40px; padding: 0 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 15px; }
  .sidebar a[aria-current="page"] { background: #fff; color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); }

  main { padding: 28px 32px 48px; min-width: 0; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  h1 { margin: 0; font-size: 24px; }
  .primary {
    display: inline-flex; align-items: center; height: 40px; padding: 0 16px;
    border: 0; border-radius: 6px; background: var(--brand); color: #FFFFFF;
    font: inherit; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer;
  }
  .tabs { display: flex; gap: 4px; margin: 20px 0 12px; border-bottom: 1px solid var(--line); }
  .tabs button {
    height: 40px; padding: 0 12px; border: 0; border-bottom: 2px solid transparent; background: none;
    color: var(--muted); font: inherit; font-size: 14px; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
  .tabs .n { margin-left: 4px; font-variant-numeric: tabular-nums; }

  .bulk { display: flex; align-items: center; gap: 8px; height: 44px; margin-bottom: 8px; padding: 0 12px; border-radius: 8px; background: #f3f4f6; font-size: 14px; }
  .bulk[hidden] { display: none; }
  .bulk strong { margin-right: auto; }
  .bulk button { height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font: inherit; font-size: 14px; cursor: pointer; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { height: 52px; padding: 0 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { height: 40px; color: var(--muted); font-weight: 500; font-size: 13px; }
  th.amount, td.amount { text-align: right; font-variant-numeric: tabular-nums; }
  th.amount button { display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
  .arrow { display: inline-block; width: 12px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: #F9FAFB; }
  tbody tr:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
  .check-col { width: 44px; }
  input[type="checkbox"] { width: 18px; height: 18px; margin: 0; }
  .badge { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 12px; font-weight: 600; color: #fff; }
  .badge.draft { background: #f3f4f6; color: #4b5563; }
  .badge.sent { background: #2563EB; }
  .badge.overdue { background: #DC2626; }
  .badge.paid { background: #16A34A; }

  .notice { padding: 64px 16px; text-align: center; color: var(--muted); }
  .notice p { margin: 0 0 16px; font-size: 15px; color: var(--ink); }
  .ghost { height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font: inherit; font-size: 14px; cursor: pointer; }

  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 20; width: 400px;
    padding: 24px; border-left: 1px solid var(--line); background: #fff;
    box-shadow: -8px 0 24px rgba(17, 24, 39, 0.08);
    transform: translateX(100%);
    transition: transform 250ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .panel.is-open { transform: translateX(0); }
  .panel-head { display: flex; align-items: center; justify-content: space-between; }
  .panel h2 { margin: 0; font-size: 18px; }
  .icon-button { width: 40px; height: 40px; border: 0; border-radius: 8px; background: none; font-size: 20px; cursor: pointer; }
  .panel dl { display: grid; grid-template-columns: 88px 1fr; gap: 12px 8px; margin: 24px 0 0; font-size: 14px; }
  .panel dt { color: var(--muted); }
  .panel dd { margin: 0; }

  .confirm { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(17, 24, 39, 0.4); }
  .confirm[hidden] { display: none; }
  .confirm > div { width: 360px; padding: 24px; border-radius: 12px; background: #fff; }
  .confirm h2 { margin: 0 0 8px; font-size: 18px; }
  .confirm p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .confirm .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .danger { height: 40px; padding: 0 16px; border: 0; border-radius: 6px; background: #DC2626; color: #fff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }

  .menu-button { display: none; }
  .cards { display: none; list-style: none; margin: 0; padding: 0; }

  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: fixed; z-index: 25; left: 0; top: 0; transform: translateX(-100%); visibility: hidden; transition: transform 200ms ease, visibility 0s 200ms; box-shadow: 8px 0 24px rgba(0, 0, 0, 0.12); }
    .sidebar.is-open { transform: none; visibility: visible; transition: transform 200ms ease; }
    .menu-button { display: grid; place-items: center; width: 44px; height: 44px; margin-left: -10px; border: 0; background: none; cursor: pointer; }
    main { padding: 16px; }
    .top h1 { margin-right: auto; }
    .tabs { overflow-x: auto; }
    .tabs button { flex: none; }
    .table-wrap { display: none; }
    .cards { display: block; }
    .cards li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 4px; border-bottom: 1px solid var(--line); }
    .cards .who { font-weight: 600; }
    .cards .won { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
    .cards .sub { color: var(--muted); font-size: 13px; }
    .panel { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .panel, .sidebar { transition: none; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="주 메뉴">
    <p class="brand">청구 노트</p>
    <nav>
      <ul>
        <li><a href="#">대시보드</a></li>
        <li><a href="#" aria-current="page">청구서</a></li>
        <li><a href="#">고객</a></li>
        <li><a href="#">설정</a></li>
      </ul>
    </nav>
  </aside>

  <main>
    <div class="top">
      <button class="menu-button" id="menu-button" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="sidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1>청구서</h1>
      <a class="primary" href="#new">새 청구서</a>
    </div>
    <div id="content"></div>
  </main>
</div>

<div class="panel" id="panel" role="dialog" aria-labelledby="panel-title" hidden>
  <div class="panel-head">
    <h2 id="panel-title"></h2>
    <button class="icon-button" id="panel-close" type="button" aria-label="닫기">×</button>
  </div>
  <dl id="panel-body"></dl>
</div>

<div class="confirm" id="confirm" hidden>
  <div role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-desc">
    <h2 id="confirm-title"></h2>
    <p id="confirm-desc">삭제한 청구서는 되돌릴 수 없어요.</p>
    <div class="actions">
      <button class="ghost" type="button" id="confirm-cancel">취소</button>
      <button class="danger" type="button" id="confirm-ok">삭제</button>
    </div>
  </div>
</div>

<script>
  const STATUS = { draft: '초안', sent: '발송됨', overdue: '연체', paid: '결제 완료' }
  const INVOICES = [
    { no: 'INV-2611', client: '새벽빛 스튜디오', issued: '2026-11-02', due: '2026-12-02', amount: 1250000, status: 'sent' },
    { no: 'INV-2610', client: '온기 공방', issued: '2026-10-28', due: '2026-11-27', amount: 480000, status: 'overdue' },
    { no: 'INV-2609', client: '누리 디자인랩', issued: '2026-10-25', due: '2026-11-24', amount: 2300000, status: 'paid' },
    { no: 'INV-2608', client: '바람결 상점', issued: '2026-10-21', due: '2026-11-20', amount: 320000, status: 'draft' },
    { no: 'INV-2607', client: '모래알 출판', issued: '2026-10-18', due: '2026-11-17', amount: 890000, status: 'sent' },
    { no: 'INV-2606', client: '파도소리 카페', issued: '2026-10-15', due: '2026-11-14', amount: 150000, status: 'overdue' },
    { no: 'INV-2605', client: '고운결 인테리어', issued: '2026-10-11', due: '2026-11-10', amount: 3400000, status: 'sent' },
    { no: 'INV-2604', client: '산들 사진관', issued: '2026-10-08', due: '2026-11-07', amount: 670000, status: 'paid' },
    { no: 'INV-2603', client: '한올 번역', issued: '2026-10-04', due: '2026-11-03', amount: 210000, status: 'draft' },
    { no: 'INV-2602', client: '다솜 교육', issued: '2026-09-30', due: '2026-10-30', amount: 1780000, status: 'sent' },
    { no: 'INV-2601', client: '별빛 음향', issued: '2026-09-26', due: '2026-10-26', amount: 560000, status: 'overdue' },
    { no: 'INV-2600', client: '이음 컨설팅', issued: '2026-09-22', due: '2026-10-22', amount: 940000, status: 'sent' },
  ]
  const won = (n) => `${n.toLocaleString('ko-KR')}원`
  const state = new URLSearchParams(location.search).get('state')
  const content = document.getElementById('content')
  let invoices = state === 'empty' ? [] : INVOICES.slice()
  let tab = 'all'
  let sortDir = null
  const selected = new Set()
  let lastRow = null

  const rows = () => {
    const list = invoices.filter((i) => tab === 'all' || i.status === tab)
    if (sortDir) list.sort((a, b) => (sortDir === 'ascending' ? a.amount - b.amount : b.amount - a.amount))
    return list
  }
  const countOf = (status) => invoices.filter((i) => status === 'all' || i.status === status).length

  const render = () => {
    if (state === 'error') {
      content.innerHTML = `${tabsHtml()}<div class="notice"><p>청구서를 불러오지 못했어요</p><button class="ghost" type="button" onclick="location.replace(location.pathname)">다시 시도</button></div>`
      return
    }
    if (invoices.length === 0) {
      content.innerHTML = `${tabsHtml()}<div class="notice"><p>아직 만든 청구서가 없어요</p><a class="primary" href="#new">새 청구서</a></div>`
      return
    }
    const list = rows()
    const arrow = sortDir === 'ascending' ? '↑' : sortDir === 'descending' ? '↓' : ''
    content.innerHTML = `${tabsHtml()}
      <div class="bulk" id="bulk" ${selected.size === 0 ? 'hidden' : ''}>
        <strong>${selected.size}건 선택됨</strong>
        <button type="button">발송</button>
        <button type="button" id="bulk-delete">삭제</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th class="check-col"><input type="checkbox" id="check-all" aria-label="전체 선택" ${selected.size === list.length ? 'checked' : ''}></th>
            <th>청구서 번호</th><th>고객</th><th>발행일</th><th>만기일</th>
            <th class="amount" aria-sort="${sortDir ?? 'none'}"><button type="button" id="sort-amount">금액<span class="arrow" aria-hidden="true">${arrow}</span></button></th>
            <th>상태</th>
          </tr></thead>
          <tbody>${list
            .map(
              (i) => `<tr tabindex="0" data-no="${i.no}">
                <td><input type="checkbox" aria-label="${i.no} 선택" ${selected.has(i.no) ? 'checked' : ''}></td>
                <td>${i.no}</td><td>${i.client}</td><td>${i.issued}</td><td>${i.due}</td>
                <td class="amount">${won(i.amount)}</td>
                <td><span class="badge ${i.status}">${STATUS[i.status]}</span></td>
              </tr>`,
            )
            .join('')}</tbody>
        </table>
      </div>
      <ul class="cards">${list
        .map((i) => `<li><span class="who">${i.client}</span><span class="won">${won(i.amount)}</span><span class="sub">${i.no} · ${i.due}까지</span><span class="sub">${STATUS[i.status]}</span></li>`)
        .join('')}</ul>`
  }
  const tabsHtml = () =>
    `<div class="tabs" role="tablist" aria-label="상태">${['all', 'draft', 'sent', 'overdue', 'paid']
      .map((s) => `<button type="button" role="tab" aria-selected="${tab === s}" data-tab="${s}">${s === 'all' ? '전체' : STATUS[s]}<span class="n">${state === 'error' ? '' : countOf(s)}</span></button>`)
      .join('')}</div>`
  render()

  content.addEventListener('click', (event) => {
    const tabButton = event.target.closest('[role="tab"]')
    if (tabButton) {
      tab = tabButton.dataset.tab
      render()
      return
    }
    if (event.target.closest('#sort-amount')) {
      sortDir = sortDir === 'ascending' ? 'descending' : 'ascending'
      render()
      return
    }
    if (event.target.id === 'check-all') {
      const list = rows()
      if (event.target.checked) list.forEach((i) => selected.add(i.no))
      else selected.clear()
      render()
      return
    }
    if (event.target.matches('tbody input[type="checkbox"]')) {
      const no = event.target.closest('tr').dataset.no
      if (event.target.checked) selected.add(no)
      else selected.delete(no)
      render()
      return
    }
    if (event.target.closest('#bulk-delete')) {
      openConfirm()
      return
    }
    const row = event.target.closest('tbody tr')
    if (row) openPanel(row)
  })
  content.addEventListener('keydown', (event) => {
    const row = event.target.closest('tbody tr')
    if (row && event.target === row && event.key === 'Enter') openPanel(row)
  })

  // 상세 패널 — 오른쪽에서 0.25초. 닫히면 누른 행으로 포커스
  const panel = document.getElementById('panel')
  const openPanel = (row) => {
    const invoice = invoices.find((i) => i.no === row.dataset.no)
    lastRow = invoice.no
    document.getElementById('panel-title').textContent = invoice.no
    document.getElementById('panel-body').innerHTML = `<dt>고객</dt><dd>${invoice.client}</dd><dt>발행일</dt><dd>${invoice.issued}</dd><dt>만기일</dt><dd>${invoice.due}</dd><dt>금액</dt><dd>${won(invoice.amount)}</dd><dt>상태</dt><dd>${STATUS[invoice.status]}</dd>`
    panel.hidden = false
    panel.getBoundingClientRect()
    panel.classList.add('is-open')
    document.getElementById('panel-close').focus()
  }
  const closePanel = () => {
    panel.classList.remove('is-open')
    setTimeout(() => (panel.hidden = true), matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 260)
    content.querySelector(`tbody tr[data-no="${lastRow}"]`)?.focus()
  }
  document.getElementById('panel-close').addEventListener('click', closePanel)
  document.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape') return
    if (!confirmBox.hidden) closeConfirm()
    else if (!panel.hidden) closePanel()
  })

  // 삭제 확인
  const confirmBox = document.getElementById('confirm')
  const openConfirm = () => {
    document.getElementById('confirm-title').textContent = `청구서 ${selected.size}건을 삭제할까요?`
    confirmBox.hidden = false
    document.getElementById('confirm-cancel').focus()
  }
  const closeConfirm = () => {
    confirmBox.hidden = true
    document.getElementById('bulk-delete')?.focus()
  }
  document.getElementById('confirm-cancel').addEventListener('click', closeConfirm)
  document.getElementById('confirm-ok').addEventListener('click', () => {
    invoices = invoices.filter((i) => !selected.has(i.no))
    selected.clear()
    confirmBox.hidden = true
    render()
  })

  // 휴대폰 — 햄버거로 사이드바 열고 닫기
  const sidebar = document.getElementById('sidebar')
  const menuButton = document.getElementById('menu-button')
  menuButton.addEventListener('click', () => {
    const open = menuButton.getAttribute('aria-expanded') !== 'true'
    menuButton.setAttribute('aria-expanded', String(open))
    sidebar.classList.toggle('is-open', open)
  })
</script>
</body>
</html>
